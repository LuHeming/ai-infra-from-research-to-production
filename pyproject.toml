[project]
name = "ai-infra-from-research-to-production"
version = "0.1.0"
description = "Learning notes, labs and benchmarks for AI infrastructure and LLM compression deployment."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
