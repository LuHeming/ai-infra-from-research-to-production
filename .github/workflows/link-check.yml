name: Link check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "./**/*.md"
          fail: true
