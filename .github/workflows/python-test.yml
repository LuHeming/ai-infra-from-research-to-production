name: Python checks

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
